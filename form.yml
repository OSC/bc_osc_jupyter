---
cluster:
  - "ascend"
  - "cardinal"
  - "pitzer"
form:
  - auto_accounts
  - auto_modules_app_jupyter
  - mode
  - working_dir
  - global_job_type
  - global_enable_mem
  - global_num_cores
  - global_mem
  - bc_num_hours
  - global_gpus
  - global_gpu_type
  - auto_modules_cuda
  - global_enable_debug
  - bc_email_on_started
  - global_default_values
attributes:
  auto_modules_app_jupyter:
    label: "Jupyter version"
    default: false
  auto_modules_cuda:
    default: false
  mode:
    widget: "radio"
    value: "1"
    options:
      - ["Jupyter Lab", "1"]
      - ["Jupyter Notebook", "0"]
  working_dir:
    widget: "path_selector"
    label: "Root Directory"
    show_hidden: false
    show_files: false   # Only display directories
    help: "Select your project directory; defaults to $HOME"
